apiVersion: apps/v1
kind: Deployment

metadata:
  name: ticket-app

spec:

  replicas: 1

  selector:
    matchLabels:
      app: ticket-app

  template:

    metadata:
      labels:
        app: ticket-app

    spec:
      containers:
      - name: ticket-app
        image: ticket-app-app
        imagePullPolicy: Never
        ports:
        - containerPort: 3001

        env:
        - name: DATABASE_URL
          value: postgresql://postgres:postgres@host.docker.internal:5432/ticket_app?sslmode=disable
        - name: PORT
          value: "3001"
        - name: JWT_ACCESS_SECRET
          value: "your-access-secret"
        - name: JWT_REFRESH_SECRET
          value: "your-refresh-secret"
        - name: SWAGGER_ENABLED
          value: "true"

---
apiVersion: v1
kind: Service

metadata:
  name: ticket-app-service

spec:

  selector:
    app: ticket-app

  ports:

  - port: 3001
    targetPort: 3001
    nodePort: 30001

  type: NodePort